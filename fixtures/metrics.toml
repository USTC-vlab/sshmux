address = "0.0.0.0:8022"

[ssh]
host-keys = [{ path = "fixtures/ssh_host_ed25519_key" }]

[auth]
endpoint = "http://127.0.0.1:5000"
version = "v1"

[metrics]
enabled = true
service-name = "sshmux-fixture"
interval-seconds = 15
attributes = [
    { name = "deployment.environment.name", value = "staging" },
]
connection-grouping = false

[metrics.otlp]
enabled = true
protocol = "http"
endpoint = "http://127.0.0.1:4318/v1/metrics"
timeout-seconds = 5
headers = [
    { name = "Authorization", value = "ApiKey 12345678" },
]

[metrics.prometheus]
enabled = true
address = "127.0.0.1:9123"
path = "/sshmux/metrics"
